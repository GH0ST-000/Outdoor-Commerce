name: outdoor-commerce

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-outdoor_commerce}
      MYSQL_USER: ${MYSQL_USER:-outdoor}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - outdoor
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      - "${MYSQL_PUBLISH_PORT:-3306}:3306"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - outdoor
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_change_me}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - outdoor
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MEILI_PUBLISH_PORT:-7700}:7700"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    networks:
      - outdoor
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Outdoor Commerce}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${BACKEND_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-outdoor_commerce}
      DB_USERNAME: ${MYSQL_USER:-outdoor}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FILESYSTEM_DISK: local
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-masterKey_change_me}
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_change_me}
      MEILISEARCH_INDEX_PREFIX: outdoor_local
      MEILISEARCH_CONNECT_TIMEOUT: "0.4"
      MEILISEARCH_REQUEST_TIMEOUT: "1.5"
      SEARCH_ENABLED: "true"
      SEARCH_FALLBACK_ENABLED: "true"
      SEARCH_DEFAULT_LOCALE: ka
      MEDIA_AVIF_ENABLED: ${MEDIA_AVIF_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    networks:
      - outdoor
    ports:
      - "${BACKEND_PUBLISH_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    command: >
      sh -c "if [ ! -d vendor ]; then composer install --no-interaction; fi &&
             rm -f public/storage &&
             php artisan serve --host=0.0.0.0 --port=8000"

  # Derivative generation for Day 9 media. Shares the ./backend bind mount with the
  # API container, so originals written by a request are visible to the worker and
  # the generated derivatives are visible back to the API — no object storage and no
  # named volume required. Media lives under backend/storage/app/{private,public}/media
  # and therefore persists on the host across container rebuilds.
  queue:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    environment:
      APP_NAME: ${APP_NAME:-Outdoor Commerce}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${BACKEND_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE:-outdoor_commerce}
      DB_USERNAME: ${MYSQL_USER:-outdoor}
      DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FILESYSTEM_DISK: local
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY:-masterKey_change_me}
      MEILISEARCH_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_change_me}
      MEILISEARCH_INDEX_PREFIX: outdoor_local
      SEARCH_ENABLED: "true"
      SEARCH_FALLBACK_ENABLED: "true"
      SEARCH_DEFAULT_LOCALE: ka
      MEDIA_AVIF_ENABLED: ${MEDIA_AVIF_ENABLED:-false}
    depends_on:
      backend:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - outdoor
    command: >
      sh -c "if [ ! -d vendor ]; then composer install --no-interaction; fi &&
             php artisan queue:work --queue=media,catalog,default --tries=3 --timeout=180"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_APP_URL: ${FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8000}
      WATCHPACK_POLLING: ${WATCHPACK_POLLING:-true}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - outdoor
    ports:
      - "${FRONTEND_PUBLISH_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    command: >
      sh -c "if [ ! -d node_modules/next ]; then npm install; fi &&
             npm run dev"

networks:
  outdoor:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  meilisearch_data:
  frontend_node_modules:
